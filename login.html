    <main>
      <div class="container" style="max-width: 600px;">
        <section>
          <h2>เข้าสู่ระบบ</h2>
          <p>กรุณาเข้าสู่ระบบเพื่อจัดการเนื้อหาของเว็บไซต์ (แบบฟอร์มตัวอย่าง)</p>
          <form onsubmit="alert('เข้าสู่ระบบสำเร็จ (ทดสอบ)'); return false;">
            <div style="margin-bottom: 1rem;">
              <label for="username">ชื่อผู้ใช้:</label><br />
              <input type="text" id="username" name="username" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: var(--border-radius);" required />
            </div>
            <div style="margin-bottom: 1rem;">
              <label for="password">รหัสผ่าน:</label><br />
              <input type="password" id="password" name="password" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: var(--border-radius);" required />
            </div>
            <button type="submit" class="cta">เข้าสู่ระบบ</button>
          </form>
        </section>
      </div>
    </main>
